<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />

    <meta name="description" content="مساعد ذكاء اصطناعي يجيب عن الأسئلة الشرعية وحدها، ويقابل كل دليل بمصدره: الآيات من المصحف، والأحاديث من موسوعة الدرر السنية." />

    <!-- تثبيت التطبيق -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#04201F" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- ليفتح على آيفون بلا شريط متصفح -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مِشْكاة" />

    <meta property="og:title" content="مِشْكاة — للأسئلة الشرعية" />
    <meta property="og:description" content="أسئلتك الشرعية، مع مقابلة كل دليل بمصدره." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:image" content="./icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- الإعداد: عنوان الوركر. عدّله بعد النشر دون إعادة بناء -->
    <script src="./config.js"></script>

    <!-- رقم البناء: يظهر في لوحة المظهر ليُعرف أيّ نسخة تعمل فعلًا -->
    <script>window.MISHKAT_BUILD = "202608181826";</script>

    <style>
      /*
       * interactive-widget=resizes-content في وسم viewport أعلاه يجعل
       * لوحة المفاتيح تُقلّص المحتوى بدل أن تدفعه، فيبقى الشريط العلويّ.
       * ولا يُثبَّت الجسم هنا: التثبيت كان يمنع المتصفح من إعادة الترتيب.
       */
      html, body {
        margin: 0; padding: 0; background: #04201F;
        height: 100%; overflow: hidden; overscroll-behavior: none;
      }
      #root { height: 100%; }
      .boot { height: 100dvh; display: grid; place-items: center; color: #9EAAA2;
              font-family: system-ui, sans-serif; font-size: 14px; }
    </style>
    <script type="module" crossorigin src="./app.js?v=202608181826"></script>
  </head>
  <body>
    <div id="root"><div class="boot">تُفتح مِشْكاة…</div></div>

    <script>
      // يُسجَّل بعد التحميل حتى لا يزاحم أول رسم للصفحة
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js?v=202608181826").catch(function () {
            /* التطبيق يعمل بدونه، لكنه لا يُثبَّت ولا يفتح دون إنترنت */
          });

          /*
           * عند تفعيل نسخة جديدة من عامل الخدمة تُعاد الصفحة مرّة واحدة،
           * فيرى المستخدم التحديث فورًا بلا حاجة لإغلاق التطبيق يدويًا.
           * الحارس reloaded يمنع حلقة إعادة تحميل لا تنتهي.
           */
          var reloaded = false;
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (reloaded) return;
            reloaded = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
